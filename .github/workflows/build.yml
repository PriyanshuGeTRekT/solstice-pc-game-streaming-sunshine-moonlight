name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ github.event.repository.name }}-${{ hashFiles('src/**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-${{ github.event.repository.name }}-

      - name: Build Solstice
        run: dotnet build src/Solstice/Solstice.csproj -c Debug -nologo

      - name: Build Solstice Play
        run: dotnet build src/SolsticePlay/SolsticePlay.csproj -c Debug -nologo

      - name: Smoke test
        shell: powershell
        run: .\scripts\smoke.ps1

      - name: Release build
        shell: powershell
        run: .\build.ps1 -NoZip
