<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Solstice Play</title>
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <header class="bar">
    <div class="brand"><img src="/mark.png" alt="" width="36" height="36"><span>Solstice Play</span></div>
    <div class="bar-right">
      <div class="chip" id="hostChip" hidden></div>
      <button class="icon-btn" id="btnSettings" aria-label="Settings" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg>
      </button>
      <button class="icon-btn" id="btnFull" aria-label="Toggle full screen">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V5h4M20 9V5h-4M4 15v4h4M20 15v4h-4"/></svg>
      </button>
    </div>
  </header>

  <main id="main"></main>

  <div class="scrim" id="scrim" hidden></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="/app.js"></script>
</body>
</html>
