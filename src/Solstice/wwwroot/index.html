<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Solstice</title>
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <div class="app">
    <nav class="rail" aria-label="Sections">
      <div class="brand">
        <img src="/mark.png" alt="" width="34" height="34">
        <span>Solstice</span>
      </div>
      <div class="nav" id="nav">
        <button data-page="home" class="on">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11.5 12 4l8 7.5V20a1 1 0 0 1-1 1h-4.5v-6h-5v6H5a1 1 0 0 1-1-1z"/></svg>
          Home
        </button>
        <button data-page="devices">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2.5" y="7" width="19" height="10" rx="5"/><path d="M7 12h3M8.5 10.5v3M15.5 11h.01M17.5 13h.01"/></svg>
          Devices
        </button>
        <button data-page="library">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="3.5" width="7" height="9" rx="1.5"/><rect x="13.5" y="3.5" width="7" height="5" rx="1.5"/><rect x="13.5" y="11.5" width="7" height="9" rx="1.5"/><rect x="3.5" y="15.5" width="7" height="5" rx="1.5"/></svg>
          Library
        </button>
        <button data-page="tuning">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg>
          Tuning
        </button>
        <button data-page="activity">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12h4l2.5-7 5 14L17 12h4"/></svg>
          Activity
        </button>
      </div>
      <div class="rail-foot" id="railFoot"></div>
    </nav>

    <main id="main" tabindex="-1"></main>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <div class="scrim" id="scrim" hidden></div>

  <script src="/app.js"></script>
</body>
</html>
